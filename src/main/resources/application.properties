spring.application.name=bibliaapi
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# Configuración del servidor de recursos OAuth2 con AWS Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.<tu-region>.amazonaws.com/<tu-user-pool-id>